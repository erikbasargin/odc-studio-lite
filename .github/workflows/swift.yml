name: Swift

on:
  push:
    branches: [ "develop" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  inspect-dependencies:
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - uses: swift-actions/setup-swift@v3
    
      - name: Tuist auth
        run: mise run auth
      
      - name: Install dependecies
        run: mise run install
      
      - name: Generate Xcode project
        run: mise run generate
      
      - name: Setup Xcode cache
        run: mise run setupXcodeCache
      
      - name: Inspect dependencies
        run: mise run "Inspect dependencies"

  test-and-warm-cache:
    runs-on: macos-26
    timeout-minutes: 45
    
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - uses: swift-actions/setup-swift@v3
    
      - name: Tuist auth
        run: mise run auth
      
      - name: Install dependecies
        run: mise run install
        
      - name: Setup Xcode cache
        run: mise run setupXcodeCache
        
      - name: Run tests
        run: mise exec -- tuist test -- CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
        
      - name: Warm cache
        run: mise exec -- tuist cache
