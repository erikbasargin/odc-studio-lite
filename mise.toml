[tools]
tuist = "4.191.4"

[tasks.auth]
description = "Login to Tuist account"
run = "tuist auth login"

[tasks.edit]
description = "Edit manifest"
run = "tuist edit"

[tasks.install]
description = "Run Tuist install"
run = "tuist install"

[tasks.setupXcodeCache]
description = "Run Tuist setup cache"
run = "tuist setup cache"

[tasks.generate]
description = "Generate the Xcode project"
alias = "g"
run = "tuist generate"

[tasks.generateNoOpen]
description = "Generate the Xcode project without opening Xcode"
alias = "gno"
run = "tuist generate --no-open"

[tasks.test]
description = "Run tests"
run = "tuist test"

[tasks."Inspect dependencies"]
run = "tuist inspect dependencies"

[tasks.lint]
run = "swift-format . --recursive --in-place"

[tasks.setup]
description = "Install and generate"
run = [
    { task = "install" },
    { task = "generate" },
]
